name: Update coding stats

on:
  schedule:
    - cron: "17 0 * * *"   # every day at 05:47 IST
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stats and update the site
        run: python scripts/update_stats.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json index.html
          git commit -m "Update coding stats"
          git push
